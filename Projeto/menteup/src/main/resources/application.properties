server.port=8080

spring.datasource.url=${DATABASE_URL}
spring.datasource.username= ${DATABASE_USERNAME}
spring.datasource.password= ${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.mapper.sort-properties-alphabetically=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= ${EMAIL_PROJETO}
spring.mail.password= ${SENHA_EMAIL}

spring.jpa.show-sql=${MOSTRAR_SQL:false}
spring.jpa.properties.hibernate.format_sql=${MOSTRAR_SQL:false}

menteup.conquistas.verificar-ao-iniciar= false

# Chave que assina os tokens de login (JWT). Vem SEMPRE da variável de ambiente JWT_SECRET
# (Base64, pelo menos 32 bytes). Sem ela a aplicação não sobe.
menteup.jwt.secret=${JWT_SECRET}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.packagesToScan=com.umc.menteup.controller
springdoc.swagger-ui.use-root-path=true
springdoc.api-docs.enabled=${SWAGGER_ATIVO:true}
springdoc.swagger-ui.enabled=${SWAGGER_ATIVO:true}
springdoc.swagger-ui.tagsSorter=alpha
