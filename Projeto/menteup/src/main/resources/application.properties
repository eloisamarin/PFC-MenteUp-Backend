server.port=8080

### Atrás do proxy do Render: usa o IP real de quem chamou e reconhece o HTTPS (liga o HSTS)
### Só confia no X-Forwarded-For vindo da rede interna, então ninguém forja o IP gravado nos logs
server.forward-headers-strategy=native

spring.datasource.url=${DATABASE_URL}
spring.datasource.username= ${DATABASE_USERNAME}
spring.datasource.password= ${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.mapper.sort-properties-alphabetically=false

spring.jpa.show-sql=${MOSTRAR_SQL:false}
spring.jpa.properties.hibernate.format_sql=${MOSTRAR_SQL:false}

menteup.conquistas.verificar-ao-iniciar= false

# Chave que assina os tokens de login (JWT). Vem SEMPRE da variável de ambiente JWT_SECRET
# (Base64, pelo menos 32 bytes). Sem ela a aplicação não sobe.
menteup.jwt.secret=${JWT_SECRET}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.packagesToScan=com.umc.menteup.controller
springdoc.swagger-ui.use-root-path=true
### Documentação da API desligada por padrão (em produção ela mostraria todas as rotas)
### Para usar no computador, defina SWAGGER_ATIVO=true na configuração do IntelliJ
springdoc.api-docs.enabled=${SWAGGER_ATIVO:false}
springdoc.swagger-ui.enabled=${SWAGGER_ATIVO:false}
springdoc.swagger-ui.tagsSorter=alpha

### E-mails pela API do Brevo. Sem a BREVO_API_KEY a aplicação não sobe
### O remetente precisa estar cadastrado como "sender" verificado no Brevo
menteup.email.brevo-api-key=${BREVO_API_KEY}
menteup.email.remetente=${EMAIL_PROJETO}

### Endereços do front que podem chamar a API, separados por vírgula
### No Render: CORS_ORIGENS=https://endereco-do-front.vercel.app (aceita curinga para as prévias)
menteup.cors.origens=${CORS_ORIGENS:http://localhost:5173}

### Termo e Política: com true, quem não aceitou a versão atual recebe 428 (ACEITE_PENDENTE)
### Deixe false até o front tratar o 428; depois ligue no Render com EXIGIR_ACEITE=true
menteup.documentos.exigir-aceite=${EXIGIR_ACEITE:false}

### Descarte de dados vencidos sobe diariamente às 3h ou quando a aplicação sobe pelo render
### Os prazos precisam ser os mesmos do item 8 da Política de Privacidade
### Registros de acesso: 6 meses, o mínimo do art. 15 do Marco Civil da Internet (Lei 12.965/2014)
menteup.retencao.ativa=${RETENCAO_ATIVA:true}
menteup.retencao.horario=0 0 3 * * *
menteup.retencao.logs-meses=${RETENCAO_LOGS_MESES:6}
menteup.retencao.codigos-dias=1
menteup.retencao.links-dias=7
menteup.retencao.cadastro-rejeitado-dias=30
menteup.retencao.convite-vencido-dias=30

### Esqueci minha senha: pedidos aceitos por IP a cada 15 minutos e por e-mail a cada hora
menteup.senha.esqueci.limite-ip=${ESQUECI_LIMITE_IP:10}
menteup.senha.esqueci.limite-email=${ESQUECI_LIMITE_EMAIL:3}
