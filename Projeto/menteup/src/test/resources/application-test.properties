# Perfil "test": ativado com @ActiveProfiles("test").
# Sobrescreve TODAS as variáveis de ambiente do application.properties principal,
# para os testes rodarem em uma máquina limpa, sem banco nem credenciais reais.

# H2 em memória, descartável
spring.datasource.url=jdbc:h2:mem:menteup_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# Cria as tabelas a partir das entidades e apaga ao final
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

### Chave falsa do Brevo, só para a aplicação subir nos testes (nenhum e-mail real é enviado)
menteup.email.brevo-api-key=chave-falsa-dos-testes
menteup.email.remetente=teste@menteup.local

# Não inicializa o Firebase nos testes (não há credenciais do Google aqui)
firebase.enabled=false

# Token que o Grafana usa para ler a API /dashboard (só nos testes)
menteup.dashboard.token=token-da-dashboard-de-teste

# Chave do JWT só para os testes (gerada aleatoriamente; não é a chave de produção)
menteup.jwt.secret=2FCORs2TQmkkj+8QGx7+St8msfmdm1FwUc5n3Ucf6dZ0jraUwO8LNm+nYuZiu/LBAqgswMbvBmCOI7ThIyBr1Q==

# A rotina de descarte não roda sozinha nos testes: o teste de retenção chama ela direto
menteup.retencao.ativa=false

# Nos testes todos os pedidos saem do mesmo IP: o limite por IP fica alto
menteup.senha.esqueci.limite-ip=1000
