# Perfil "test": ativado com @ActiveProfiles("test").
# Sobrescreve TODAS as variáveis de ambiente do application.properties principal,
# para os testes rodarem em uma máquina limpa, sem banco nem credenciais reais.

# H2 em memória, descartável
spring.datasource.url=jdbc:h2:mem:menteup_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# Cria as tabelas a partir das entidades e apaga ao final
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# O EmailService precisa de um JavaMailSender; o host abaixo só faz o bean existir (nenhum e-mail real é enviado)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=teste@menteup.local
spring.mail.password=sem-senha
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Não inicializa o Firebase nos testes (não há credenciais do Google aqui)
firebase.enabled=false

# Token que o Grafana usa para ler a API /dashboard (só nos testes)
menteup.dashboard.token=token-da-dashboard-de-teste

