# Pipeline de integração contínua (CI) do MenteUp.
# Roda automaticamente a cada Pull Request aberto ou atualizado para a main,
# em um ambiente limpo (ubuntu-latest), com 3 checagens independentes em paralelo.
name: CI

on:
  pull_request:
    branches: [main]

# Permissão mínima: o workflow só precisa ler o código do repositório.
permissions:
  contents: read

# O projeto Maven fica em Projeto/menteup.
defaults:
  run:
    working-directory: Projeto/menteup

jobs:
  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Somente os testes sem Spring, sem banco e sem rede (exclui a tag "integration").
      - name: Rodar os testes unitários
        run: ./mvnw -B test -DexcludedGroups=integration

  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Somente os testes com a tag "integration": API + service + banco H2 em memória (perfil "test").
      - name: Rodar os testes de integração
        run: ./mvnw -B test -Dgroups=integration

  linter:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Checkstyle com as regras versionadas em Projeto/menteup/checkstyle.xml.
      - name: Rodar o Checkstyle
        run: ./mvnw -B checkstyle:check
